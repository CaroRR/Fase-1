<!DOCTYPE html>

<html>

<head>

<title>Sistema de Análisis de Sentimientos</title>

<style>

body{

background:#f4f6f9;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.container{

background:white;

padding:40px;

width:600px;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,.15);

text-align:center;

}

textarea{

width:100%;

height:160px;

padding:12px;

font-size:16px;

border-radius:10px;

}

button{

margin-top:20px;

padding:12px 25px;

border:none;

border-radius:8px;

background:#007bff;

color:white;

font-size:16px;

cursor:pointer;

}

.result{

margin-top:25px;

font-size:28px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>🍽️ Sistema de Análisis de Sentimientos de Restaurants</h1>

<form method="POST">

<textarea
name="review"
placeholder="Escribe tu reseña aquí..."
required>
</textarea>

<br>

<button type="submit">

Analizar reseña

</button>

</form>

{% if resultado %}

<div class="result">

{{ resultado }}

</div>

{% endif %}

</div>

</body>

</html>
